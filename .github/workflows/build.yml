name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Bundle latest yt-dlp (override library's old version)
        run: |
          # Download latest yt-dlp release (with fallback)
          YTDLP_VER=$(curl -s https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "$YTDLP_VER" ]; then
            echo "GitHub API failed, using fallback version"
            YTDLP_VER="2026.08.19"
          fi
          echo "Latest yt-dlp: $YTDLP_VER"
          curl -sL "https://github.com/yt-dlp/yt-dlp/archive/refs/tags/${YTDLP_VER}.zip" -o /tmp/ytdlp.zip
          rm -rf /tmp/ytdlp_src && mkdir -p /tmp/ytdlp_src
          unzip -q /tmp/ytdlp.zip -d /tmp/ytdlp_src
          cd /tmp/ytdlp_src/yt-dlp-*
          # Create zip with yt_dlp/ directory (library expects this format)
          zip -qr /tmp/ytdlp_new.zip yt_dlp
          # Prepend Python shebang (23 bytes) like the library's bundled file
          printf '#!/usr/bin/env python3\n' | cat - /tmp/ytdlp_new.zip > "${{ github.workspace }}/app/src/main/res/raw/ytdlp"
          ls -lh "${{ github.workspace }}/app/src/main/res/raw/ytdlp"
          echo "Bundled yt-dlp $YTDLP_VER"

      - name: Decode or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > downloader-release.jks
            echo "Keystore decoded from secret"
          else
            echo "No keystore secret, generating new one..."
            keytool -genkeypair -v -keystore downloader-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass "phoenix2026" -keypass "phoenix2026" -dname "CN=Phoenix, OU=Downloader, O=Phoenix, L=Yangon, ST=Yangon, C=MM"
            echo "New keystore generated"
          fi
          ls -lh downloader-release.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/downloader-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'phoenix2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'phoenix2026' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release/
          ls -lh *.apk
          # Rename to user-friendly names: v8 for arm64-v8a, v7 for armeabi-v7a
          for f in *arm64-v8a*.apk; do
            [ -f "$f" ] && mv "$f" "Phoenix-downloader-v8.apk" && echo "Renamed $f -> Phoenix-downloader-v8.apk"
          done
          for f in *armeabi-v7a*.apk; do
            [ -f "$f" ] && mv "$f" "Phoenix-downloader-v7.apk" && echo "Renamed $f -> Phoenix-downloader-v7.apk"
          done
          ls -lh *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-downloader-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
